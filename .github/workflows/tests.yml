name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + tests, no GPU)
        run: pip install -e ".[dev]"
      - name: Run CPU tests
        run: pytest
      - name: Verify pre-registration fingerprints
        run: |
          sha256sum -c PREREG_SHA256SUMS
          cd kv-eviction-comparison/docs && sha256sum -c PREREG.sha256
