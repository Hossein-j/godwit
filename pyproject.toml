[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gei"
version = "0.1.0"
description = "Godwit Endurance Inference: in-generation model self-shrinking under a fixed memory and energy envelope"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
gpu = ["torch>=2.4", "transformers>=4.53", "accelerate>=1.0", "datasets>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "matplotlib>=3.8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"
